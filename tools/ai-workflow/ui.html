<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Newl AI Development Engine</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #15231f;
        --muted: #66736e;
        --paper: #f4f2eb;
        --surface: rgba(255, 255, 255, 0.92);
        --line: #d9ddd7;
        --green: #0b7555;
        --green-deep: #07533e;
        --amber: #b45d12;
        --red: #a23535;
        --blue: #315da8;
        --shadow: 0 18px 50px rgba(30, 45, 39, 0.09);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 5% 0%, rgba(80, 150, 122, 0.15), transparent 30rem),
          radial-gradient(circle at 100% 15%, rgba(216, 156, 73, 0.12), transparent 26rem),
          var(--paper);
        font: 15px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.55; }

      .shell { max-width: 1440px; margin: 0 auto; padding: 26px; }
      .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
      .brand { display: flex; align-items: center; gap: 13px; }
      .mark {
        width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px;
        color: white; background: linear-gradient(145deg, var(--green), var(--green-deep));
        font: 700 20px/1 Georgia, serif; box-shadow: 0 10px 24px rgba(11, 117, 85, 0.24);
      }
      .brand h1 { margin: 0; font: 700 22px/1.15 Georgia, serif; letter-spacing: -0.02em; }
      .brand p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
      .local-badge {
        padding: 7px 11px; border: 1px solid #bcd5ca; border-radius: 999px;
        color: var(--green-deep); background: #eef8f3; font-size: 12px; font-weight: 700;
      }

      .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
      .panel { background: var(--surface); border: 1px solid rgba(201, 207, 201, 0.78); border-radius: 18px; box-shadow: var(--shadow); }
      .sidebar { padding: 14px; position: sticky; top: 20px; }
      .sidebar-title { padding: 7px 8px 12px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
      .feature-list { display: grid; gap: 7px; }
      .feature-button {
        width: 100%; padding: 12px; text-align: left; color: var(--ink); background: transparent;
        border: 1px solid transparent; border-radius: 12px;
      }
      .feature-button:hover { background: #f7f8f5; border-color: var(--line); }
      .feature-button.active { background: #eaf5ef; border-color: #bdd8cc; }
      .feature-button strong, .feature-button span { display: block; }
      .feature-button span { margin-top: 3px; color: var(--muted); font-size: 12px; }

      main { min-width: 0; display: grid; gap: 16px; }
      .hero { padding: 24px; }
      .eyebrow { color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; }
      .hero-row { display: flex; justify-content: space-between; align-items: start; gap: 18px; margin-top: 7px; }
      .hero h2 { margin: 0; font: 700 31px/1.16 Georgia, serif; letter-spacing: -0.025em; }
      .hero p { margin: 8px 0 0; color: var(--muted); }
      .stage {
        flex: 0 0 auto; padding: 7px 11px; border-radius: 999px; color: var(--blue);
        background: #eef3fb; border: 1px solid #cddaf0; font-size: 12px; font-weight: 800;
      }
      .stage.running { color: var(--green-deep); background: #eaf6f0; border-color: #bddfce; }
      .stage.attention { color: var(--amber); background: #fff5e9; border-color: #efd2ad; }
      .meta-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
      .meta { padding: 11px 12px; background: #f8f8f5; border: 1px solid #e5e7e2; border-radius: 11px; min-width: 0; }
      .meta label { display: block; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
      .meta span { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }

      .grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr); gap: 16px; }
      .section { padding: 20px; }
      .section h3 { margin: 0; font: 700 19px/1.25 Georgia, serif; }
      .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
      .count { color: var(--muted); font-size: 12px; }
      .empty { padding: 25px; color: var(--muted); text-align: center; border: 1px dashed #ced4ce; border-radius: 12px; }

      .alert { border: 1px solid #e5c4a0; background: #fff8ee; }
      .alert h3 { color: #753b09; }
      .correction { padding: 11px 0; border-bottom: 1px solid #efddc8; }
      .correction:last-child { border-bottom: 0; }
      .correction strong { color: var(--amber); margin-right: 6px; }
      .action-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
      .confirm { min-width: 220px; flex: 1; padding: 10px 12px; border: 1px solid #c8cfca; border-radius: 10px; background: white; }
      .primary {
        border: 0; border-radius: 10px; padding: 10px 15px; color: white;
        background: var(--green); font-weight: 800; box-shadow: 0 7px 16px rgba(11, 117, 85, 0.18);
      }
      .primary:hover:not(:disabled) { background: var(--green-deep); }

      .phase { padding: 13px 0; border-bottom: 1px solid #e6e9e5; }
      .phase:last-child { border-bottom: 0; }
      .phase-top { display: flex; justify-content: space-between; gap: 12px; }
      .phase strong { font-size: 14px; }
      .phase p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .pill { flex: 0 0 auto; height: fit-content; padding: 3px 7px; border-radius: 7px; background: #f0f2ef; color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
      .pill.approved { color: var(--green); background: #e9f6f0; }
      .pill.blocked, .pill.owner_gated { color: var(--amber); background: #fff1e2; }

      .question { padding: 15px 0; border-bottom: 1px solid #e5e8e4; }
      .question:last-child { border-bottom: 0; }
      .question-title { margin: 5px 0 0; font-weight: 750; }
      .question-note { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
      .question form { display: grid; gap: 8px; margin-top: 11px; }
      .question textarea, .question select, .question input[type="text"] { width: 100%; padding: 10px 11px; border: 1px solid #cbd1cc; border-radius: 9px; background: white; }
      .question textarea { min-height: 74px; resize: vertical; }
      .answer { margin-top: 8px; padding: 10px; border-radius: 9px; background: #edf7f2; color: var(--green-deep); }

      .events { max-height: 380px; overflow: auto; }
      .event { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid #ebedea; font-size: 13px; }
      .event:last-child { border-bottom: 0; }
      .event time { color: var(--muted); font-variant-numeric: tabular-nums; }
      .job { margin-bottom: 12px; padding: 11px; border-radius: 10px; background: #edf7f2; color: var(--green-deep); }
      .job.failed { color: var(--red); background: #fff0ef; }
      .toast { position: fixed; right: 24px; bottom: 24px; max-width: 420px; padding: 12px 15px; border-radius: 11px; color: white; background: #21312b; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast.error { background: var(--red); }
      .hidden { display: none !important; }

      @media (max-width: 900px) {
        .shell { padding: 16px; }
        .layout, .grid-2 { grid-template-columns: 1fr; }
        .sidebar { position: static; }
        .feature-list { display: flex; overflow-x: auto; }
        .feature-button { min-width: 205px; }
        .meta-grid { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 560px) {
        .masthead, .hero-row { align-items: flex-start; }
        .local-badge { display: none; }
        .hero h2 { font-size: 26px; }
        .meta-grid { grid-template-columns: 1fr; }
        .hero, .section { padding: 17px; }
        .action-row { align-items: stretch; flex-direction: column; }
        .confirm, .primary { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="brand">
          <div class="mark">N</div>
          <div><h1>Newl AI Development Engine</h1><p>Operator console</p></div>
        </div>
        <div class="local-badge">Local only · no deploy, merge, or migration</div>
      </header>

      <div class="layout">
        <aside class="panel sidebar">
          <div class="sidebar-title">Features</div>
          <div id="feature-list" class="feature-list"><div class="empty">Loading…</div></div>
        </aside>
        <main id="main"><section class="panel section"><div class="empty">Select a feature to begin.</div></section></main>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      const TOKEN = "__NEWL_UI_TOKEN__";
      let features = [];
      let selectedSlug = null;
      let actionPending = false;

      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const api = async (path, options = {}) => {
        const response = await fetch(path, {
          ...options,
          headers: { "x-newl-ui-token": TOKEN, "content-type": "application/json", ...(options.headers || {}) }
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `Request failed (${response.status})`);
        return payload;
      };

      const toast = (message, isError = false) => {
        const node = document.getElementById("toast");
        node.textContent = message;
        node.className = `toast show${isError ? " error" : ""}`;
        setTimeout(() => { node.className = "toast"; }, 4500);
      };

      const shortHash = (value) => value ? value.slice(0, 10) : "—";
      const stageLabel = (value) => String(value || "unknown").replaceAll("_", " ");
      const isAttention = (stage) => ["waiting_questions", "review_failed", "correction_required", "interrupted", "escalated"].includes(stage);
      const isRunning = (stage) => ["preflight", "planning", "implementing", "verifying", "correcting", "reviewing", "recovering_review"].includes(stage);

      function renderFeatureList() {
        const list = document.getElementById("feature-list");
        list.replaceChildren();
        if (!features.length) {
          list.append(el("div", "empty", "No registered features found."));
          return;
        }
        for (const feature of features) {
          const button = el("button", `feature-button${feature.featureSlug === selectedSlug ? " active" : ""}`);
          button.type = "button";
          button.append(el("strong", "", feature.featureTitle));
          button.append(el("span", "", `${stageLabel(feature.stage)} · ${feature.blockingQuestions} questions`));
          button.addEventListener("click", () => { selectedSlug = feature.featureSlug; render(); });
          list.append(button);
        }
      }

      function meta(label, value, title = value) {
        const node = el("div", "meta");
        node.append(el("label", "", label));
        const text = el("span", "", value || "—");
        text.title = title || "";
        node.append(text);
        return node;
      }

      function section(title) {
        const node = el("section", "panel section");
        const head = el("div", "section-head");
        head.append(el("h3", "", title));
        node.append(head);
        return { node, head };
      }

      function renderCorrections(feature) {
        const boundary = feature.correctionBoundary;
        if (!boundary) return null;
        const node = el("section", "panel section alert");
        node.append(el("div", "eyebrow", "Saved correction boundary"));
        node.append(el("h3", "", `${boundary.phaseId} needs another correction pass`));
        const intro = el("p", "question-note", `The exact ${boundary.source} findings are saved. Resuming skips planning and the initial builder pass.`);
        node.append(intro);
        boundary.corrections.forEach((correction, index) => {
          const row = el("div", "correction");
          row.append(el("strong", "", `${index + 1}.`));
          row.append(document.createTextNode(correction));
          node.append(row);
        });
        const actions = el("div", "action-row");
        const input = el("input", "confirm");
        input.type = "text";
        input.placeholder = boundary.ownerActionRequired ? `Type ${boundary.phaseId}` : "No extra confirmation required";
        input.disabled = !boundary.ownerActionRequired;
        const button = el("button", "primary", boundary.ownerActionRequired ? "Authorize one correction attempt" : "Resume saved correction");
        button.type = "button";
        button.disabled = actionPending || feature.activeRun || feature.job?.status === "running";
        button.addEventListener("click", async () => {
          if (boundary.ownerActionRequired && input.value.trim() !== boundary.phaseId) {
            toast(`Type ${boundary.phaseId} exactly to continue.`, true); return;
          }
          await postAction(feature, "resume-correction", {
            phaseId: boundary.phaseId,
            diffHash: boundary.diffHash,
            confirmation: input.value.trim()
          });
        });
        actions.append(input, button);
        node.append(actions);
        return node;
      }

      function renderRoadmap(feature) {
        const { node, head } = section("Roadmap");
        head.append(el("span", "count", `${feature.phases.length} phases`));
        if (!feature.phases.length) node.append(el("div", "empty", "No approved roadmap yet."));
        feature.phases.forEach((phase) => {
          const row = el("div", "phase");
          const top = el("div", "phase-top");
          top.append(el("strong", "", `${phase.id} — ${phase.title}`));
          top.append(el("span", `pill ${phase.status}`, phase.status.replaceAll("_", " ")));
          row.append(top);
          row.append(el("p", "", `${phase.risk.replaceAll("_", " ")} risk · ${phase.reviewCycles} reviews · ${phase.retryCount} retries`));
          node.append(row);
        });
        return node;
      }

      function answerControl(question) {
        if (question.type === "multiple_choice") {
          const select = el("select");
          select.append(el("option", "", "Choose an answer…"));
          for (const choice of question.choices) {
            const option = el("option", "", choice.label);
            option.value = choice.value;
            select.append(option);
          }
          return select;
        }
        if (question.type === "yes_no") {
          const select = el("select");
          const blank = el("option", "", "Choose yes or no…"); blank.value = "";
          const yes = el("option", "", "Yes"); yes.value = "yes";
          const no = el("option", "", "No"); no.value = "no";
          select.append(blank, yes, no);
          return select;
        }
        const textarea = el("textarea");
        textarea.placeholder = "Write the business decision in plain language…";
        return textarea;
      }

      function renderQuestions(feature) {
        const { node, head } = section("Owner questions");
        const pending = feature.questions.filter((question) => !question.confirmedAt);
        head.append(el("span", "count", `${pending.length} unanswered`));
        if (!feature.questions.length) node.append(el("div", "empty", "No owner questions for this feature."));
        feature.questions.forEach((question) => {
          const wrap = el("div", "question");
          wrap.append(el("div", "eyebrow", `${question.id}${question.blocking ? " · blocking" : " · deferred"}`));
          wrap.append(el("div", "question-title", question.text));
          if (question.whyItMatters) wrap.append(el("p", "question-note", `Why it matters: ${question.whyItMatters}`));
          if (question.evidence?.length) wrap.append(el("p", "question-note", `Evidence: ${question.evidence.join(" · ")}`));
          if (question.confirmedAt) {
            wrap.append(el("div", "answer", `Confirmed: ${question.answer}${question.explanation ? ` — ${question.explanation}` : ""}`));
          } else {
            const form = el("form");
            const control = answerControl(question);
            const explanation = el("input");
            explanation.type = "text";
            explanation.placeholder = "Optional explanation";
            const save = el("button", "primary", "Confirm answer");
            save.type = "submit";
            save.disabled = feature.activeRun;
            form.append(control, explanation, save);
            form.addEventListener("submit", async (event) => {
              event.preventDefault();
              const answer = control.value.trim();
              if (!answer) { toast("Enter or select an answer first.", true); return; }
              if (!window.confirm(`Confirm this answer for ${question.id}?\n\n${answer}`)) return;
              save.disabled = true;
              try {
                await api(`/api/features/${feature.featureSlug}/questions/${encodeURIComponent(question.id)}`, {
                  method: "POST",
                  body: JSON.stringify({ answer, explanation: explanation.value, planHash: question.planHash, questionHash: question.questionHash })
                });
                toast(`${question.id} was confirmed.`);
                await refresh(true);
              } catch (error) { toast(error.message, true); save.disabled = false; }
            });
            wrap.append(form);
          }
          node.append(wrap);
        });
        return node;
      }

      function renderNext(feature) {
        const { node } = section("Next eligible phase");
        const phase = feature.nextPhase;
        if (!phase) { node.append(el("div", "empty", "No pending phase is eligible.")); return node; }
        node.append(el("div", "eyebrow", `${phase.id} · ${phase.effectiveRisk.replaceAll("_", " ")}`));
        node.append(el("div", "question-title", phase.title));
        node.append(el("p", "question-note", phase.objective));
        if (phase.expectedFiles?.length) node.append(el("p", "question-note", `Expected files: ${phase.expectedFiles.join(", ")}`));
        if (phase.expectedTests?.length) node.append(el("p", "question-note", `Expected tests: ${phase.expectedTests.join(", ")}`));
        if (feature.blockingQuestions) node.append(el("div", "answer", `${feature.blockingQuestions} owner question(s) remain. Only questions that apply to this phase block it.`));
        const actions = el("div", "action-row");
        const confirmation = el("input", "confirm");
        const needsPhaseId = ["high", "owner_gated"].includes(phase.effectiveRisk);
        confirmation.placeholder = needsPhaseId ? `Type ${phase.id}` : "Type approve";
        const button = el("button", "primary", `Approve ${phase.id} only and run`);
        button.type = "button";
        button.disabled = !feature.actions.canApproveNext || actionPending || feature.activeRun || feature.job?.status === "running";
        button.addEventListener("click", async () => {
          const expected = needsPhaseId ? phase.id : "approve";
          if (confirmation.value.trim() !== expected) { toast(`Type ${expected} exactly to approve this phase.`, true); return; }
          await postAction(feature, "approve-run", {
            phaseId: phase.id, planHash: feature.planHash, diffHash: feature.diffHash, confirmation: confirmation.value.trim()
          });
        });
        actions.append(confirmation, button);
        node.append(actions);
        return node;
      }

      function renderEvents(feature) {
        const { node, head } = section("Live progress");
        head.append(el("span", "count", "refreshes every 3 seconds"));
        if (feature.job) {
          const job = el("div", `job${feature.job.status === "failed" ? " failed" : ""}`,
            feature.job.status === "running" ? "Workflow active — a quiet model call may still be working." :
            feature.job.status === "failed" ? `Stopped safely: ${feature.job.error}` : "Workflow action completed."
          );
          node.append(job);
        } else if (feature.activeRun) {
          node.append(el("div", "job", "Workflow active in another terminal — this page is read-only until it stops."));
        }
        const events = el("div", "events");
        const recent = (feature.events || []).slice(-20).reverse();
        if (!recent.length) events.append(el("div", "empty", "No progress events yet."));
        recent.forEach((event) => {
          const row = el("div", "event");
          const timestamp = event.recordedAt || event.timestamp || event.at;
          row.append(el("time", "", timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "—"));
          row.append(el("div", "", event.message || event.type || "Workflow event"));
          events.append(row);
        });
        node.append(events);
        return node;
      }

      async function postAction(feature, action, payload) {
        actionPending = true; render();
        try {
          await api(`/api/features/${feature.featureSlug}/actions/${action}`, { method: "POST", body: JSON.stringify(payload) });
          toast("Workflow started. This page will keep updating.");
          await refresh(true);
        } catch (error) { toast(error.message, true); }
        finally { actionPending = false; render(); }
      }

      function render() {
        renderFeatureList();
        const main = document.getElementById("main");
        main.replaceChildren();
        const feature = features.find((candidate) => candidate.featureSlug === selectedSlug);
        if (!feature) { main.append(el("section", "panel section", "Select a feature to begin.")); return; }

        const hero = el("section", "panel hero");
        hero.append(el("div", "eyebrow", feature.featureSlug));
        const row = el("div", "hero-row");
        const title = el("div");
        title.append(el("h2", "", feature.featureTitle));
        title.append(el("p", "", feature.finalOutcome || "Local workflow state and owner actions."));
        const stage = el("span", `stage${isRunning(feature.stage) ? " running" : isAttention(feature.stage) ? " attention" : ""}`, stageLabel(feature.stage));
        row.append(title, stage); hero.append(row);
        const metas = el("div", "meta-grid");
        metas.append(meta("Branch", feature.branch), meta("HEAD", shortHash(feature.headCommit), feature.headCommit), meta("Diff", shortHash(feature.diffHash), feature.diffHash));
        metas.append(meta("Planner", feature.models?.plannerModel), meta("Builder", feature.models?.builderModel), meta("Reviewer", feature.models?.reviewerModel));
        hero.append(metas); main.append(hero);

        const corrections = renderCorrections(feature);
        if (corrections) main.append(corrections);
        const topGrid = el("div", "grid-2");
        topGrid.append(renderNext(feature), renderEvents(feature)); main.append(topGrid);
        const lower = el("div", "grid-2");
        lower.append(renderQuestions(feature), renderRoadmap(feature)); main.append(lower);
      }

      async function refresh(keepSelection = false) {
        try {
          features = await api("/api/features");
          if (!keepSelection || !features.some((feature) => feature.featureSlug === selectedSlug)) {
            selectedSlug = selectedSlug && features.some((feature) => feature.featureSlug === selectedSlug)
              ? selectedSlug : features[0]?.featureSlug || null;
          }
          render();
        } catch (error) { toast(error.message, true); }
      }

      refresh();
      setInterval(() => refresh(true), 3000);
    </script>
  </body>
</html>
